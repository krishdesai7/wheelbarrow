name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          uv-file: uv.toml

      - name: Install dependencies
        run: uv sync --frozen

      - name: Run checks
        run: uv run just i