[build-system]
requires = ["uv_build>=0.11.30,<0.12"]
build-backend = "uv_build"


[project]
name = "wheelforge"
description = "Convert OS binaries into PyPI-installable python wheels"
readme = "README.md"
version = "1.0.1"
requires-python = ">=3.14"
authors = [{ name = "Krish Desai", email = "krish@desai.ml" }]
keywords = [
    "wheel",
    "packaging",
    "pypi",
    "binary",
    "executable",
    "cli",
    "distribution",
    "cross-platform",
    "platform-tag",
    "manylinux",
]
license="MIT OR Apache-2.0"
license-files = ["LICENSE-APACHE", "LICENSE-MIT"]
# No `License ::` classifier: those are deprecated under PEP 639, and PyPI
# rejects metadata carrying both them and the `license` expression above.
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    # The wheels it *produces* are platform-specific; wheelforge itself reads
    # headers off disk and infers nothing from the host, so it runs anywhere.
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Build Tools",
    "Topic :: System :: Archiving :: Packaging",
    "Topic :: System :: Software Distribution",
    "Typing :: Typed",
]
dependencies = [
    "build>=1.2",
    "packaging>=24.0",
    "typer>=0.27.0",
    # The backend for generated projects. Depending on it directly lets the
    # default build path skip PEP 517 isolation and run in-process.
    "uv_build>=0.11.30,<0.12",
]

[project.scripts]
wheelforge = "wheelforge.cli:app"

[tool.uv.build-backend]
editable-profile = "dev"
module-name = "wheelforge"

[dependency-groups]
dev = [
    "pyrefly>=1.1.1",
    "pytest>=8.0",
    "ruff>=0.15.18",
    "rust-just>=1.57.0",
]

release = [
  "rooster==0.1.1",
]

[project.urls]
repository = "https://github.com/krishdesai7/wheelforge"
Changelog = "https://github.com/krishdesai7/wheelforge/blob/main/CHANGELOG.md"
Releases = "https://github.com/krishdesai7/wheelforge/releases"

[tool.rooster]
changelog-contributors = false
major-labels = []
minor-labels = ["breaking"]
ignore-labels = ["internal", "ci", "testing", "automations"]

[tool.rooster.section-labels]
"Breaking changes" = ["breaking"]
"Enhancements" = ["enhancement", "compatibility", "error messages"]
"Preview features" = ["preview"]
"Configuration" = ["configuration"]
"Performance" = ["performance"]
"Bug fixes" = ["bug"]
"Rust API" = ["rustlib"]
"Documentation" = ["documentation"]
"Other changes" = ["__unknown__"]

[tool.pyright]
venvPath = "."
venv = ".venv"
stubPath = ""
extraPaths = []
